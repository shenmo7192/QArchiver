# Reusable build workflow for Debian 13 (amd64/arm64) and Windows (x64/arm64).
# 可复用的 Debian 13（amd64/arm64）与 Windows（x64/arm64）构建工作流。

name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13 x86_64 (deb)
            os: ubuntu-24.04
            platform: linux
            arch: amd64
          - name: Debian 13 ARM64 (deb)
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - name: Windows x86_64 (portable zip)
            os: windows-2022
            platform: windows
            arch: x64
            qt_arch: win64_msvc2022_64
            cmake_arch: x64
            run_tests: true
          - name: Windows ARM64 (portable zip)
            os: windows-2022
            platform: windows
            arch: arm64
            qt_arch: win64_msvc2022_arm64_cross_compiled
            cmake_arch: ARM64
            run_tests: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------------
      # Debian 13 package
      # Build inside Debian 13 so the generated Depends/ABI match Debian and
      # Deepin instead of Ubuntu 24.04 (noble).
      # 在 Debian 13 容器内构建，使依赖与 ABI 面向 Debian/Deepin，而不是 Ubuntu 24.04。
      # ---------------------------------------------------------------------
      - name: Build Debian 13 package and run tests
        if: matrix.platform == 'linux'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:13 bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential ca-certificates devscripts equivs fakeroot
              mk-build-deps --install --remove \
                --tool "apt-get -y --no-install-recommends" debian/control
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
              cmake --build build --parallel "$(nproc)"
              ctest --test-dir build --output-on-failure
              mkdir -p dist
              dpkg-buildpackage -us -uc -b -jauto
              cp ../qarchiver_*_${{ matrix.arch }}.deb dist/
            '

      - name: Verify package installs on Debian 13
        if: matrix.platform == 'linux'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/dist:/dist:ro" \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:13 bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                /dist/qarchiver_*_${{ matrix.arch }}.deb
              dpkg -s qarchiver >/dev/null
              # The package must not depend on anything missing from a clean
              # Debian 13 install (the reason this job exists).
              if ldd /usr/bin/QArchiver | grep -q "not found"; then
                echo "QArchiver has unresolved shared libraries" >&2
                exit 1
              fi
              # Verify the bundled helper and the desktop integration actually
              # made it into the package.
              dpkg -L qarchiver > /tmp/qarchiver-files.txt
              helper="$(grep -m1 '/libexec/qarchiver/7zip/7zzs$' /tmp/qarchiver-files.txt)"
              test -n "$helper"
              test -x "$helper"
              test -f /usr/share/applications/qarchiver.desktop
              test -f /usr/share/icons/hicolor/256x256/apps/qarchiver.png
            '

      - name: Upload Debian package
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: qarchiver-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------------------
      # Windows / portable ZIP
      # ---------------------------------------------------------------------
      - name: Install Qt (Windows)
        if: matrix.platform == 'windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: ${{ matrix.qt_arch }}
          # WebP/TIFF/ICNS image plugins live in the separate qtimageformats
          # module; thumbnails need them.
          # WebP/TIFF/ICNS 图片插件位于独立的 qtimageformats 模块，缩略图需要。
          modules: 'qtimageformats'
          cache: true

      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $testing = if ('${{ matrix.run_tests }}' -eq 'true') { 'ON' } else { 'OFF' }
          $cmakeArgs = @(
            '-S', '.', '-B', 'build',
            '-G', 'Visual Studio 17 2022',
            '-A', '${{ matrix.cmake_arch }}',
            '-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR",
            '-DQARCHIVER_USE_LIBARCHIVE=OFF',
            "-DBUILD_TESTING=$testing"
          )
          if ($env:QT_HOST_PATH) {
            $cmakeArgs += "-DQT_HOST_PATH=$env:QT_HOST_PATH"
          }
          cmake @cmakeArgs

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test (Windows x64)
        if: matrix.platform == 'windows' && matrix.run_tests
        shell: pwsh
        run: |
          # The CLI/backend tests rely on POSIX-specific temp-file behaviour;
          # keep the portable Qt/unit subset as the Windows gate.
          # CLI/后端测试依赖 POSIX 临时文件行为；Windows 只跑可移植的 Qt/单元子集。
          ctest --test-dir build -C Release --output-on-failure `
            -R "^(tst_utils|tst_toolchain|tst_background|tst_preferences)$"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: cpack --config build/CPackConfig.cmake -C Release

      - name: Build installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          try {
            # Local scripts are blocked by the default execution policy on some
            # runner images.
            # 部分运行器镜像的默认执行策略会阻止运行本地脚本。
            Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          } catch {
            Write-Host "Could not change the execution policy: $($_.Exception.Message)"
          }
          # The bundled Simplified Chinese language file requires Inno Setup
          # 6.5+; upgrade the runner image copy when necessary.
          # 简体中文语言文件需要 Inno Setup 6.5+；必要时升级镜像自带版本。
          choco upgrade innosetup -y --no-progress
          # The runner image normally ships Inno Setup 6; install it through
          # Chocolatey when it is missing.
          # 运行器镜像通常自带 Inno Setup 6；缺失时通过 Chocolatey 安装。
          $iscc = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
          }
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }
          Write-Host "Using ISCC: $iscc"
          Write-Host "ISCC version: $((Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion)"
          $env:INNO_SETUP_ISCC = $iscc
          $zip = Get-ChildItem -Filter "QArchiver-*-windows-${{ matrix.arch }}.zip" |
            Select-Object -First 1
          if (-not $zip) { throw 'Portable package was not created.' }
          Write-Host "Portable package: $($zip.FullName) ($($zip.Length) bytes)"
          try {
            ./packaging/windows/build-installer.ps1 -ZipPath $zip.FullName `
              -OutputDir (Get-Location) -Arch '${{ matrix.arch }}'
          } catch {
            Write-Host "::error::Installer build failed: $($_.Exception.Message)"
            Write-Host $_.ScriptStackTrace
            exit 1
          }

      - name: Upload Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          # One artifact per deliverable: the installer artifact contains only
          # the bare setup.exe, the portable artifact only the ZIP.
          # 每种产物单独上传：安装器 artifact 只包含 setup.exe，
          # 便携版 artifact 只包含 ZIP。
          name: qarchiver-windows-${{ matrix.arch }}-installer
          path: QArchiver-*-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows portable package
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: qarchiver-windows-${{ matrix.arch }}-portable
          path: QArchiver-*-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
